<div class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <i class="fas fa-utensils"></i> <h2>Confirmar Envío a Cocina</h2>
    </div>

    <div class="alert-box">
      <i class="fas fa-exclamation-triangle"></i>
      <p>
        ¿Estás seguro de enviar este pedido a la cocina? Una vez enviado, no podrás modificarlo.
      </p>
    </div>

    <div class="order-summary" *ngIf="orden">
      <h4>Resumen del pedido:</h4>
      <div class="summary-item" *ngFor="let item of orden.items">
        <span>{{ item.cantidad }}x {{item.nombre}}</span>
        <span>{{ item.precio | currency }}</span>
      </div>
      <div class="summary-total">
        <span>Total</span>
        <span>{{ orden.total | currency}}</span>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-confirm" (click)="onConfirmar()">Sí, enviar a cocina</button>
      <button class="btn btn-cancel" (click)="onCancelar()">Cancelar</button>
    </div>
  </div>
</div>
